<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3a53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camp Shots">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Camp Shot List · SurfScout</title>
<style>
  :root { --bg:#f4f7f8; --card:#fff; --ink:#0f2530; --muted:#5c7480; --brand:#0b3a53; --accent:#ff7a3d; --ok:#1f9d6b; --line:#e2e9ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent; }
  header { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; }
  h1 { font-size:17px; margin:0 0 8px; }
  .row { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .row button { flex:none; border:0; border-radius:999px; padding:7px 12px; font-size:14px; font-family:inherit; }
  .camps button { background:rgba(255,255,255,.15); color:#fff; }
  .camps button.on { background:#fff; color:var(--brand); font-weight:600; }
  .days { margin-top:8px; }
  .days button { background:rgba(255,255,255,.1); color:#fff; font-size:13px; padding:6px 11px; }
  .days button.on { background:var(--accent); color:#fff; font-weight:600; }
  .days button small { opacity:.8; font-weight:400; }
  .filters { padding:10px 14px 0; }
  .filters button { background:#e3ebee; color:var(--ink); font-size:13px; }
  .filters button.on { background:var(--ink); color:#fff; }
  .bar { height:6px; background:rgba(255,255,255,.2); border-radius:3px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .3s; }
  .stat { font-size:12px; opacity:.85; margin-top:5px; }
  main { padding:6px 12px 90px; max-width:720px; margin:0 auto; }
  details.section { background:var(--card); border-radius:14px; margin:10px 0; border:1px solid var(--line); }
  details.section > summary { list-style:none; padding:13px 14px; font-weight:650; font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  details.section > summary::-webkit-details-marker { display:none; }
  summary .count { font-weight:500; font-size:12px; color:var(--muted); flex:none; }
  .why { font-size:12.5px; color:var(--muted); padding:0 14px 8px; margin-top:-6px; line-height:1.4; }
  .shot { display:flex; gap:10px; padding:11px 14px; border-top:1px solid var(--line); }
  .shot input[type=checkbox] { width:24px; height:24px; flex:none; margin-top:1px; accent-color:var(--ok); }
  .shot.done .title { text-decoration:line-through; color:var(--muted); }
  .title { font-size:15px; line-height:1.3; }
  .tip { font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.35; }
  .tags { margin-top:5px; display:flex; gap:5px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:2px 7px; border-radius:6px; background:#eef3f5; color:var(--muted); }
  .tag.v { background:#ffe9dd; color:#b4471a; }
  .tag.p { background:#dff1fb; color:#14608a; }
  .tag.must { background:#ffeded; color:#c0392b; font-weight:600; }
  .tag.cmp { background:#efe6ff; color:#6a3fb5; }
  .tag.q { background:#e9f7ef; color:#1f7a50; }
  .note { width:100%; margin-top:6px; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; font-size:16px; display:none; }
  .shot.open .note { display:block; }
  .nbtn { background:none; border:0; color:#14608a; font-size:12px; padding:4px 0 0; font-family:inherit; }
  .card { background:#fff8e8; border:1px solid #f3e1b5; border-radius:14px; padding:12px 14px; margin:12px 0; font-size:13.5px; line-height:1.45; }
  .card.today { background:#eaf6fb; border-color:#bfe1f0; }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .card ul { margin:0; padding-left:18px; }
  .card li { margin:2px 0; }
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:30px 10px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; }
  footer button { flex:1; border:0; border-radius:10px; padding:12px; font-size:14px; font-weight:600; background:var(--brand); color:#fff; font-family:inherit; }
  footer button.sec { background:#e3ebee; color:var(--ink); flex:.6; }
  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 14px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>📸 Camp Review Shot List</h1>
  <div class="row camps" id="camps"></div>
  <div class="row days" id="days"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="stat" id="stat"></div>
</header>
<div class="row filters" id="filters">
  <button data-f="all" class="on">All</button>
  <button data-f="must">Must-haves</button>
  <button data-f="todo">Not done</button>
  <button data-f="video">🎥 Videos</button>
  <button data-f="photo">📷 Photos</button>
  <button data-f="cmp">⚖️ Match shots</button>
</div>
<main id="main"></main>
<footer>
  <button class="sec" id="reset">Reset camp</button>
  <button id="share">Share notes</button>
</footer>
<div class="toast" id="toast"></div>

<script>
// ---- Plan (agreed with Joe 2026-11-10) -------------------------------
// 3 nights Padang Padang Surf Camp (Nov 11-13), then 3 nights Kima Surf Uluwatu
// (Nov 14-16). Camps told at check-in. Joe on camera. Two reviews + one
// head-to-head. Vertical first. Phone only. Storage: 4K only for surf action.
const SCHEDULE = {
  padang: ["2026-11-11", "2026-11-12", "2026-11-13"],
  kima:   ["2026-11-14", "2026-11-15", "2026-11-16"],
};
// S(id, title, type P|V, must, day 1-3, tip, flags)  flags: c = match shot (same angle at both camps), q = facts/notes only
const S = (id, t, type, must, day, tip = "", f = "") => ({ id, t, type, must, day, tip, cmp: f.includes("c"), q: f.includes("q") });

const CAMPS = {
  padang: {
    name: "Padang Padang Surf Camp", short: "Padang Padang",
    blurb: "What our listing claims (prove it or correct it in the review): private en-suite rooms only, ~20 guests, groups capped at 6, a coaching session between surfs, pool, ice bath + sauna, surf skate bowl + pump track, yoga shala, coworking. Breakfast + lunch included, dinner NOT. Lessons billed separately (GBP 20/session, GBP 35 for two).",
    claims: [
      S("icebath", "Ice bath + sauna", "P", true, 1, "Wide vertical showing both. A clip of someone using the ice bath is a strong Reel, but only with their OK."),
      S("coworking", "Coworking space + Wi-Fi there", "P", true, 1, "Desks and plugs. Speed test from the desk; put Mbps in the note."),
      S("pricesheet", "Lesson price list", "P", true, 1, "We say GBP 20 a session, GBP 35 for two in a day, guiding GBP 12-20. Photo any printed price list or ask at reception.", "q"),
      S("dorms", "Check: any dorms?", "P", false, 1, "We say private rooms only. If you see a dorm, photo + note it.", "q"),
      S("dinner", "Where the group eats dinner", "P", false, 1, "Dinner isn't included. Snap the warung/restaurant, note the cost of a typical dinner."),
      S("skate", "Surf skate bowl + pump track", "V", true, 2, "10-15 s of someone skating the bowl. 4K 60fps."),
      S("coachsession", "Coaching session between surfs", "V", true, 2, "Video review, land drills, pool drills or surf skate, whichever runs that day. Their main selling point."),
      S("groupsize", "Count a lesson group", "P", true, 2, "One wide frame where you can count the group (we say max 6). Real number in the note.", "q"),
      S("yoga", "Yoga shala", "P", false, 2, "Wide, empty or mid-class (ask first)."),
      S("coaches", "Head coaches (Richie / Randy)", "P", false, 2, "Portrait with their OK. Note names and roles as they say them. Ask Richie how long he's coached here (we say 20+ years)."),
    ],
    wave: [
      S("lineupcliff", "Padang Padang from the cliff", "V", true, 1, "Wide 15 s of the lineup from above, mid-morning."),
      S("walkbeach", "Walk from camp to the beach", "V", true, 1, "POV clip, 1080p. Note minutes, the number of stairs, and if it's hard with a board.", "c"),
    ],
  },
  kima: {
    name: "Kima Surf Uluwatu", short: "Kima Uluwatu",
    blurb: "What our listing claims: new camp, first season. Twice-daily guiding across 6 levels, video analysis + surf theory daily, pool, gardens, on-site bar, 3-course breakfast, snacks between sessions, free-flow coffee, Saturday BBQ, yoga 6 days/week, a Kima boat to outer reefs, premium board rental. Rooms: dorm / room / villa. First season = date any problems you find (\"Nov 2026, first season: X wasn't finished\").",
    claims: [
      S("poolgarden", "Pool + garden wide", "P", true, 1, "Their hero shot. Vertical, plus one landscape wide for the review header."),
      S("roomtypes", "Dorm vs Room vs Villa", "P", true, 1, "You're known as a reviewer here, so ask reception to show all three. Note your room type and what you paid."),
      S("quiverkima", "Check the board quiver", "P", true, 1, "We say shortboards 5'8\"-7'0\", funshapes, mini mals 7'0\"-7'8\". Note if soft-tops exist for beginners.", "q"),
      S("newbuild", "New-build check", "P", true, 1, "Any unfinished areas, building work or noise. Date it in the note. Honest review gold."),
      S("bbq", "Saturday BBQ (your first night, Sat 14th)", "V", false, 1, "Your arrival day is a Saturday. 10 s vertical of the BBQ; faces small or with OK."),
      S("concierge", "Concierge / front desk", "P", false, 1, "Claimed 7am-11pm. Note how fast WhatsApp replies are.", "q"),
      S("bar", "On-site bar", "P", true, 2, "One daytime + one evening shot with people (ask first)."),
      S("snacks", "Snacks + free-flow coffee station", "P", false, 2, "Proof of the 'finger foods between sessions' claim."),
      S("videoanalysis", "Video analysis / surf theory session", "V", true, 2, "10-15 s of the session running. Note if it really happens daily."),
      S("beginnerspot", "Beginner course spot", "V", false, 2, "Beginners go to Thomas Beach / Balangan / Dreamland. Clip of a lesson + drive time."),
      S("boat", "Kima boat trip", "V", false, 3, "Only if it runs while you're there. Boat loading + outer reef lineup. 4K."),
    ],
    wave: [
      S("walkbeach", "Walk from camp to the beach", "V", true, 1, "POV clip, 1080p. Cliff camp: count the stairs and the minutes back up with a board.", "c"),
      S("lineupkima", "Uluwatu / Balangan lineup from shore", "V", false, 2, "Wide 15 s of wherever they take your level."),
    ],
  },
};

// Shared sections (same at both camps). "c" = shoot the SAME angle at both for the head-to-head.
const COMMON = [
  { id:"arrive", title:"🚪 Arrival", why:"You're telling them at check-in, so shoot these BEFORE you walk in. They're the only 'normal guest' shots you'll get.", shots:[
    S("sign", "Entrance / sign from the street", "P", true, 1, "Vertical + one landscape. Daylight if you can.", "c"),
    S("walkin", "Walk-in POV, gate to reception", "V", true, 1, "One steady 15-20 s take. 1080p.", "c"),
    S("firstimp", "First-impression selfie video", "V", true, 1, "20 s to camera: \"First impression of ___ is…\". Honest beats polished. 1080p.", "c"),
  ]},
  { id:"room", title:"🛏️ Your room", why:"Most-asked question from bookers. Shoot BEFORE you unpack, same angles at both camps.", shots:[
    S("roomwide", "Room wide from the doorway", "P", true, 1, "0.5× lens, lights on, curtains open, from the door.", "c"),
    S("bathroom", "Bathroom + shower", "P", true, 1, "Run the shower: note if hot water works and how long it takes.", "c"),
    S("roomtour", "One-take room tour", "V", true, 1, "30-45 s slow pan, 1080p. Door → bed → bathroom → view.", "c"),
    S("view", "View from room / balcony", "P", false, 1),
    S("gear", "Where your board / wetsuit goes", "P", false, 1, "Board storage, hooks, drying rack."),
    S("wifi", "Wi-Fi speed test (screenshot)", "P", true, 1, "In the room AND the common area. Mbps in the note.", "cq"),
  ]},
  { id:"common", title:"🏊 Pool & common areas", why:"Camp-life shots are SurfScout's biggest asset gap. Free photo libraries don't have them.", shots:[
    S("poolwide", "Pool wide, empty, midday", "P", true, 1, "Vertical + one landscape wide (header image).", "c"),
    S("dining", "Dining area at a meal", "P", true, 1, "Shows how social it is. Wide, faces small or with OK.", "c"),
    S("poolpeople", "Pool with people in it", "V", false, 2, "Someone jumping in = great hook. Ask first. 4K 60fps."),
    S("lounge", "Lounge / chill area", "P", false, 2),
  ]},
  { id:"food", title:"🍳 Food", why:"'What's included' is the #1 confusion in camp pricing.", shots:[
    S("breakfast", "Breakfast, overhead", "P", true, 1, "Same overhead framing at both camps. Note what's included.", "c"),
    S("meals", "Every other included meal, overhead", "P", true, 2, "One photo per meal. Note in the box: included or paid extra?", "q"),
    S("platepan", "Buffet / plate walk-by", "V", false, 2, "5-8 s."),
  ]},
  { id:"surf", title:"🏄 The surf programme", why:"This is the review. Prove the coaching, not just the scenery. Surf action = the ONLY place to use 4K.", shots:[
    S("rack", "Board rack / rental quiver", "P", true, 1, "Foam/soft-tops vs hard boards, and their condition.", "c"),
    S("briefing", "Morning briefing / surf check", "V", true, 2, "Coach explaining the plan. 15 s, 1080p."),
    S("van", "Van / transfer loading boards", "V", true, 2, "Note drive time to each break.", "q"),
    S("lineupshore", "Lineup from shore, wide", "V", true, 2, "15 s, steady. 4K.", "c"),
    S("lessongroup", "Lesson group in the water", "V", true, 2, "Coach pushing a student into a wave. Men AND women. 4K 60fps."),
    S("ride", "A surfer riding, full body in frame", "V", true, 2, "Zoom 2-3× and follow the whole ride. Surfer in frame start to finish. 4K 60fps."),
    S("closeups", "Pop-up / paddle-out close-ups", "V", false, 2, "Short action for Reels. 4K 60fps."),
    S("photog", "Camp photographer: what does a package cost?", "P", false, 2, "Just ask + note the price. Don't buy without thinking it over.", "q"),
    S("analysis", "Their video-analysis screen", "P", false, 3, "If they do it."),
  ]},
  { id:"social", title:"📱 Social clips (Reels / TikTok)", why:"Hook in the first second. You on camera = strongest format.", shots:[
    S("midstay", "Day-2 check-in to camera", "V", true, 2, "15-20 s: \"Day 2 at ___. Best thing so far / worst thing so far.\" 1080p."),
    S("wax", "Waxing a board, close-up", "V", false, 2, "5 s, 60fps for slow-mo."),
    S("hangout", "Group hanging out after surf", "V", false, 2, "Ask the group first."),
    S("sunset", "Sunset from the cliff", "V", false, 2, "Max 1-2 clips. Golden hour doesn't match SurfScout's blue palette."),
  ]},
  { id:"honest", title:"🔍 Honest stuff", why:"SurfScout's edge is honesty. Capture the downsides too, dated.", shots:[
    S("noise", "Noise at night (roads, roosters, bar, building)", "V", false, 2, "10 s audio-on clip if it's loud."),
    S("crowd", "Crowd in the lineup at peak time", "P", false, 2, "Count heads; number in the note.", "q"),
    S("broken", "Anything worn, broken or not as advertised", "P", true, 3, "Mould, broken fittings, missing amenities. Note what was promised."),
  ]},
  { id:"verdict", title:"🎤 Verdict (last evening or checkout morning)", why:"The voice of the review. Do it before you leave.", shots:[
    S("verdict", "Verdict to camera", "V", true, 3, "45-60 s: who it's for, who should skip it, would you rebook, the real total cost. 1080p.", "c"),
    S("paid", "What you paid + any discount or freebie", "P", true, 3, "Private, for pricing data AND the disclosure line. If anything was free or discounted, the review must say so.", "q"),
  ]},
];

const HEAD2HEAD = { id:"h2h", title:"⚖️ Head-to-head (Kima, last day)", why:"For the 'Padang Padang vs Kima Uluwatu' piece. Only after you've seen both.", shots:[
  S("h2hverdict", "Padang vs Kima to camera", "V", true, 3, "45-60 s: which one for beginners, intermediates, a couple, a budget trip. 1080p."),
  S("h2hnotes", "Score both 1-5", "P", true, 3, "Type in the note: coaching, room, food, social, value, access to waves.", "q"),
]};

const RULES = `<ul>
  <li><b>Vertical first.</b> Only shoot landscape where the tip says "landscape" (review header images).</li>
  <li><b>Storage is tight</b> (SurfScout Drive has ~4 GB free). <b>4K only for surf action.</b> Everything else 1080p. Settings → Camera → Record Video.</li>
  <li>Hold every clip 10 s+. 60fps for action.</li>
  <li>Daylight, mid-morning to mid-afternoon, so colours stay blue and bright.</li>
  <li>Keep the surfer in frame for the whole ride. Mix men and women in the action clips.</li>
  <li><b>Faces up close:</b> get a spoken "OK to use on SurfScout?" on video first. Everyone else small, blurred or from behind.</li>
  <li><b>⚖️ Match shots:</b> shoot the exact same angle at both camps so the head-to-head lines up.</li>
  <li>Avoid other brands' logos and signs in frame where you can.</li>
  <li>Tap <b>+ note</b> to log facts (minutes, Mbps, prices, group size). Don't bulk-upload from camp. Send me your best clips after.</li>
</ul>`;

// ---- State ------------------------------------------------------------
const KEY = "campshots.v2";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { state = {}; }
state.done ||= {}; state.notes ||= {}; state.open ||= {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
let filter = "all";

// Today's date in Bali (WITA, UTC+8), so the right camp/day opens automatically.
function baliToday() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Makassar", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
}
function todaySlot() {
  const t = baliToday();
  for (const [c, days] of Object.entries(SCHEDULE)) { const i = days.indexOf(t); if (i >= 0) return { camp:c, day:i+1 }; }
  if (t < SCHEDULE.padang[0]) return { camp:"padang", day:1 };
  if (t === "2026-11-17") return { camp:"kima", day:3 }; // checkout morning
  return null;
}
// Auto-jump once per calendar day; manual choice sticks for the rest of that day.
const slot = todaySlot();
if (state.autoDate !== baliToday()) {
  state.autoDate = baliToday();
  if (slot) { state.camp = slot.camp; state.day = slot.day; }
}
if (!CAMPS[state.camp]) state.camp = "padang";
if (![0,1,2,3].includes(state.day)) state.day = 0;
save();

function sectionsFor(c) {
  const camp = CAMPS[c];
  const secs = [
    { id:"claims", title:"⭐ Check our listing's claims", why:camp.blurb, shots:camp.claims },
    { id:"wave", title:"🌊 Getting to the waves", why:"Distance and access are what bookers can't judge from photos.", shots:camp.wave },
    ...COMMON,
  ];
  if (c === "kima") secs.push(HEAD2HEAD);
  return secs;
}
const sid = (c, s) => `${c}:${s.id}`;
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ---- Render -----------------------------------------------------------
function render() {
  const c = state.camp, day = state.day;
  document.getElementById("camps").innerHTML = Object.entries(CAMPS).map(([k,v]) =>
    `<button data-c="${k}" class="${k===c?'on':''}">${v.short} <small style="opacity:.7">Nov ${+SCHEDULE[k][0].slice(8)}–${+SCHEDULE[k][2].slice(8)}</small></button>`).join("");
  document.getElementById("days").innerHTML = [0,1,2,3].map(d =>
    `<button data-d="${d}" class="${d===day?'on':''}">${d ? `Day ${d} <small>${fmtDate(SCHEDULE[c][d-1]).split(",")[0]}</small>` : "All days"}</button>`).join("");

  let html = "", total=0, done=0, mustT=0, mustD=0, shown=0;
  const isToday = slot && slot.camp === c && slot.day === day;
  if (day) {
    const focus = {
      1: c==="padang" ? "Arrival shots before you check in, then room + pool + breakfast while everything's clean. Cliff lineup mid-morning." : "Arrival shots before check-in, room + pool + all three room types, the stairs to the beach. Saturday BBQ tonight.",
      2: "Surf day: briefing, van, lineup, lesson group, a full ride (4K). Day-2 check-in video to camera.",
      3: c==="padang" ? "Mop up anything still missing (use the 'Not done' filter), then your verdict to camera before you leave." : "Mop up missing shots, your Kima verdict, then the head-to-head video while both camps are fresh.",
    }[day];
    html += `<div class="card today"><h3>${isToday ? "📍 Today · " : ""}${CAMPS[c].short} · Day ${day} (${fmtDate(SCHEDULE[c][day-1])})</h3>${focus}</div>`;
  }
  if (!state.introHidden) html += `<div class="card"><h3>Shooting rules</h3>${RULES}<button class="nbtn" data-act="hide">Hide rules</button></div>`;

  for (const sec of sectionsFor(c)) {
    let rows = "", sT=0, sD=0;
    for (const s of sec.shots) {
      const id = sid(c, s), isDone = !!state.done[id];
      total++; if (isDone) done++;
      if (s.must) { mustT++; if (isDone) mustD++; }
      if (day && s.day !== day) continue;
      sT++; if (isDone) sD++;
      const show = filter==="all" || (filter==="must"&&s.must) || (filter==="photo"&&s.type==="P"&&!s.q) || (filter==="video"&&s.type==="V") || (filter==="todo"&&!isDone) || (filter==="cmp"&&s.cmp);
      if (!show) continue;
      shown++;
      const note = state.notes[id] || "";
      const kind = s.q ? '<span class="tag q">📝 Facts</span>' : `<span class="tag ${s.type==='V'?'v':'p'}">${s.type==='V'?'🎥 Video':'📷 Photo'}</span>`;
      rows += `<div class="shot ${isDone?'done':''} ${note?'open':''}" data-id="${id}">
        <input type="checkbox" ${isDone?'checked':''} aria-label="Mark ${esc(s.t)} done">
        <div style="flex:1;min-width:0">
          <div class="title">${esc(s.t)}</div>
          ${s.tip?`<div class="tip">${esc(s.tip)}</div>`:""}
          <div class="tags">${kind}${s.must?'<span class="tag must">Must</span>':''}${s.cmp?'<span class="tag cmp">⚖️ Match</span>':''}${!day?`<span class="tag">Day ${s.day}</span>`:''}</div>
          <button class="nbtn" data-act="note">${note?'✎ note':'+ note'}</button>
          <textarea class="note" rows="2" placeholder="e.g. 6 min walk, 42 Mbps, 5 in group…">${esc(note)}</textarea>
        </div></div>`;
    }
    if (!rows) continue;
    const key = c + ":" + sec.id, open = state.open[key] !== 0;
    html += `<details class="section" data-sec="${key}" ${open?'open':''}><summary><span>${sec.title}</span><span class="count">${sD}/${sT}</span></summary>
      <div class="why">${esc(sec.why)}</div>${rows}</details>`;
  }
  if (!shown) html += `<div class="empty">Nothing here with this filter. 🎉</div>`;
  document.getElementById("main").innerHTML = html;
  document.getElementById("prog").style.width = (total ? done/total*100 : 0) + "%";
  document.getElementById("stat").textContent = `${CAMPS[c].name} · ${done}/${total} done · must-haves ${mustD}/${mustT}`;
}

// ---- Events -----------------------------------------------------------
document.getElementById("camps").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.camp = b.dataset.c; save(); render(); scrollTo(0,0);
});
document.getElementById("days").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.day = +b.dataset.d; save(); render(); scrollTo(0,0);
});
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x===b));
  render();
});
const main = document.getElementById("main");
main.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  const id = e.target.closest(".shot").dataset.id;
  if (e.target.checked) state.done[id] = Date.now(); else delete state.done[id];
  save(); render();
});
main.addEventListener("click", e => {
  const act = e.target.dataset && e.target.dataset.act;
  if (act === "hide") { state.introHidden = 1; save(); render(); }
  if (act === "note") { const s = e.target.closest(".shot"); s.classList.add("open"); s.querySelector(".note").focus(); }
});
main.addEventListener("input", e => {
  if (!e.target.classList.contains("note")) return;
  const id = e.target.closest(".shot").dataset.id;
  if (e.target.value.trim()) state.notes[id] = e.target.value; else delete state.notes[id];
  save();
});
main.addEventListener("toggle", e => {
  const k = e.target.dataset && e.target.dataset.sec;
  if (k) { state.open[k] = e.target.open ? 1 : 0; save(); }
}, true);
document.getElementById("reset").onclick = () => {
  const c = state.camp;
  if (!confirm(`Clear all ticks and notes for ${CAMPS[c].short}?`)) return;
  for (const k of Object.keys(state.done)) if (k.startsWith(c+":")) delete state.done[k];
  for (const k of Object.keys(state.notes)) if (k.startsWith(c+":")) delete state.notes[k];
  save(); render();
};

// Share: both camps, done shots + notes + missing must-haves. Paste into Discord.
function buildReport() {
  let out = "📸 Camp review notes\n", any = false;
  for (const c of Object.keys(CAMPS)) {
    let body = "", missing = [];
    for (const sec of sectionsFor(c)) {
      const lines = [];
      for (const s of sec.shots) {
        const id = sid(c, s), d = state.done[id], n = (state.notes[id] || "").trim();
        if (!d && s.must) missing.push(s.t);
        if (d || n) lines.push(`${d?'✅':'⬜'} ${s.t}${n?` — ${n}`:''}`);
      }
      if (lines.length) body += `\n${sec.title}\n${lines.join("\n")}\n`;
    }
    if (!body) continue;
    any = true;
    out += `\n=== ${CAMPS[c].name} ===\n${body}`;
    if (missing.length) out += `\nStill missing (must-haves): ${missing.join("; ")}\n`;
  }
  return any ? out : "";
}
document.getElementById("share").onclick = async () => {
  const out = buildReport();
  if (!out) { toast("Nothing ticked or noted yet."); return; }
  try { if (navigator.share) { await navigator.share({ text: out }); return; } }
  catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(out); toast("Copied. Paste it into Discord."); }
  catch { prompt("Copy this:", out); }
};
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
